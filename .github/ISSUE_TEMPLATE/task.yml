name: Task / chore
description: Technical or process work that isn't a user story or a bug (refactor, deps, infra, docs)
title: "task: "
labels: ["chore", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done?
      description: Concrete outcome, not activity. "CI runs tests on every PR" not "look into CI".
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Where to look and what to follow: files or modules (file:line where known), related issues and PRs, docs, and constraints (stack, things that must not change). Whoever picks this up, a teammate or an agent, should not have to ask you where to start."
      placeholder: |
        - Code: src/lib/payments.ts, the settle() path
        - Related: #12, PR #40
        - Constraint: no change to the public API
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: Definition of done (verification scenarios)
      description: Concrete checks that prove it is done, including edge cases. Each one should be something you could run or click. Keep code work and ops work as separate boxes.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Edge case: empty / failure / concurrent → ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this deliberately does not include, so the implementer doesn't wander.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["critical — money correctness, security, or user-visible wrong data", "high", "medium", "low"]
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: "T-shirt estimate of the fix. If you'd pick L, first ask whether it splits."
      options: ["S — hours", "M — a day-ish", "L — multi-day (split it if you can)"]
    validations:
      required: true
