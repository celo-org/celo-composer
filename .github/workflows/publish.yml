name: Publish to NPM

# Tags are the only trigger: scripts/release.sh bumps the version, commits,
# and pushes the tag — this workflow picks it up. A manual-dispatch path that
# bumped the version in CI would publish a version the repo never recorded.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for npm trusted publishing + provenance
    # Pre-release tags (beta/alpha/rc) are handled by publish-beta.yml
    if: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-rc') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # pnpm must be on PATH before setup-node resolves its cache
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10
      - name: Upgrade npm
        run: npm install -g npm@11.20.0

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" && exit 1
          fi

      - name: Publish to NPM
        # Auth via the npm trusted publisher (celo-org/celo-composer, publish.yml);
        # provenance is attached automatically
        run: npm publish --access public

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "## Changes in this Release

          See [CHANGELOG.md](https://github.com/celo-org/celo-composer/blob/${{ github.ref_name }}/CHANGELOG.md) for detailed changes.

          ## Installation

          \`\`\`bash
          npm install -g @celo/celo-composer
          \`\`\`

          ## Usage

          \`\`\`bash
          npx @celo/celo-composer create my-celo-app
          \`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
