name: Publish Beta to NPM

# Pre-release tags only: scripts/release.sh (or a manual tag) pushes
# v*-beta*/v*-alpha*/v*-rc* and this workflow publishes under the matching
# npm dist-tag. No manual-dispatch version input — the repo stays the single
# source of truth for versions.
on:
  push:
    tags:
      - 'v*-beta*'
      - 'v*-alpha*'
      - 'v*-rc*'

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # pnpm must be on PATH before setup-node resolves its cache
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint code
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Determine dist-tag
        id: dist-tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          if [[ $TAG_NAME == *"-beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          elif [[ $TAG_NAME == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
          elif [[ $TAG_NAME == *"-rc"* ]]; then
            echo "tag=rc" >> $GITHUB_OUTPUT
          fi

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" && exit 1
          fi

      - name: Publish to NPM (Pre-release)
        run: npm publish --provenance --access public --tag ${{ steps.dist-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Pre-release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }} (Pre-release)" \
            --prerelease \
            --notes "## Pre-release Version ${{ github.ref_name }}

          ⚠️ **This is a pre-release version** - use with caution in production environments.

          ## Installation

          \`\`\`bash
          npm install -g @celo/celo-composer@${{ steps.dist-tag.outputs.tag }}
          \`\`\`

          ## Changes in this Pre-release

          See [CHANGELOG.md](https://github.com/celo-org/celo-composer/blob/${{ github.ref_name }}/CHANGELOG.md) for detailed changes."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
